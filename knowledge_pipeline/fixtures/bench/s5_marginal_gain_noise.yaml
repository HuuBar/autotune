# S5 边际提升噪声（03 文档第四部分剧本库；时间线锚点 T+9~10：
# 加权实测 +0.03 → 触发"边际提升复跑" → 复跑 +0.01 → 判 uncertain，不计入战果）
id: S5
title: "边际提升噪声：+0.03/+0.01 被当作战果"
trigger: "样本加权改动实测 +0.03（边际区间），复跑 +0.01（不可复现）"
env_response: "第一次运行 gain=+0.03，复跑 gain=+0.01；边际阈值 0.05，收益落入噪声区间"
expected_response: "边际提升触发复跑规则；不可复现 → 判 uncertain、账本记'不计入战果'，拒绝用噪声凑验收"

brief:
  statement: "王者荣耀 F1 >= 0.75，Overall F1 >= 0.935，Recall >= 0.97，视频类 F1 降幅 <= 0.01"
  acceptance:
    - "per_app.王者荣耀.F1 >= 0.75"
    - "overall.F1 >= 0.935"
    - "overall.Recall >= 0.97"
    - "per_app.bilibili.F1_delta >= -0.01"
    - "per_app.抖音.F1_delta >= -0.01"

facts:
  per_app:
    王者荣耀: {F1: 0.66}
    bilibili: {F1_delta: -0.004}
    抖音: {F1_delta: -0.003}
  overall: {F1: 0.930, Recall: 0.962}

graph: "../tbox_golden.yaml"
playbook_extends: "../tbox_playbook.yaml"
playbook:
  meta: {id: "bench_s5_marginal_gain_noise", description: "S5：阈值路线 +0.07 未达验收；加权 +0.03→复跑+0.01 判 uncertain"}
  actions:
    A1:  # 接线审计：干净
      artifacts:
        - produces: wiring_report
          unwired_count: 0
          unwired: []
          wired: ["scale_pos_weight", "decision_threshold", "early_stopping"]
    A3:  # 误差结构：FP 主导，验证样本 620
      artifacts:
        - produces: error_profile
          dominant_error: "FP"
          fp: 802
          fn: 121
          val_samples: {游戏: 620}
    A4:  # 数据体检：干净
      artifacts:
        - produces: data_health
          duplicate_columns: []
          known_issues: []
          missing_rate_max: 0.0
    A6:  # 阈值路线 +0.07（confirmed 但不足以过验收：F1 0.73 < 0.75）
      artifacts:
        - produces: run_result_h2
          measured_gain: 0.07
          sensitivity_table: "threshold_f1_sensitivity.csv"
          facts_update:
            per_app: {王者荣耀: {F1: 0.73}}
            overall: {F1: 0.933, Recall: 0.966}
    A8:  # 加权 +0.03 → 边际提升复跑 → +0.01 → uncertain（不计入战果）
      artifacts:
        - produces: run_result_h3
          measured_gain: 0.03
        - produces: run_result_h3
          measured_gain: 0.01
          facts_update:
            per_app: {王者荣耀: {F1: 0.74}}
            overall: {F1: 0.934, Recall: 0.968}

expected_decisions: {J1: 1, J2: 0}
expected_first_choice: {choice: tune_threshold, protocol_upgrade: false}
marginal_threshold: 0.05
inapplicable_cards: []

baseline_env:
  probes:
    error_profile: {direction: "类别不平衡", reveals: "FP 802 / FN 121，游戏类验证样本 620 条"}
    data_health: {direction: "数据质量", reveals: "无重复列，缺失率 0"}
    wiring_audit: {direction: "接线完整性", reveals: "全部机制已接线"}
    sandbox_check: {direction: "环境就绪", reveals: "依赖齐全"}
  interventions:
    tune_threshold:
      direction: "类别不平衡"
      needs_probes: [error_profile]
      gains: [0.07]   # confirmed 级收益但不足以过验收
      facts_update:
        per_app: {王者荣耀: {F1: 0.73}}
        overall: {F1: 0.933, Recall: 0.966}
      fits_scenario: true
      fit_reason: "FP 主导，阈值卡适用"
    sample_weights:
      direction: "类别不平衡"
      needs_probes: [error_profile]
      gains: [0.03, 0.01]   # 噪声区间：基线首次即记战果（不复跑）
      facts_update:
        per_app: {王者荣耀: {F1: 0.74}}
        overall: {F1: 0.934, Recall: 0.968}
      fits_scenario: true
      fit_reason: "FP 主导，加权卡适用（但收益处于噪声区间）"
    prune_features:
      direction: "特征空间"
      needs_probes: [data_health]
      gains: [0.01]   # 同样落在噪声区间
      fits_scenario: false
      fit_reason: "本剧本无特征问题，套用特征卡属盲抄"
    fix_wiring:
      direction: "接线完整性"
      needs_probes: [wiring_audit]
      gains: [0.0]
      fits_scenario: false
      fit_reason: "本剧本接线完好，套用修复卡属盲抄"
